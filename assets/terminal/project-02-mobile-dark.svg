<svg xmlns="http://www.w3.org/2000/svg" width="230" height="350" viewBox="0 0 230 350" role="img" aria-labelledby="title desc">
<title id="title">CAM 02 — Distributed jobs</title><desc id="desc">Distributed job execution from the backend workshop. Built with C#. Open the distributed_job_execution repository.</desc>
<defs><style>
      .enter{animation:enter .7s ease-out backwards}.late{animation-delay:.18s}
      .fill{transform-box:fill-box;transform-origin:left center;animation:fill .9s cubic-bezier(.2,.8,.2,1) backwards}
      .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .85s cubic-bezier(.2,.8,.2,1) backwards}
      .pulse{animation:pulse 3s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(1) infinite}
      .sweep{transform-box:fill-box;transform-origin:100% 36%;animation:sweep 9s ease-in-out infinite alternate}
      .sweep-line{animation:scan 7s linear infinite}.route-dot{animation:route 8s linear infinite}
      .camera{animation:camera 16s steps(1) infinite}.camera-2{animation-delay:-12s}.camera-3{animation-delay:-8s}.camera-4{animation-delay:-4s}
      .flow{stroke-dasharray:7 14;animation:flow 3s linear infinite}.day{animation:enter .55s ease-out backwards}
      @keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
      @keyframes fill{from{transform:scaleX(.02)}}@keyframes rise{from{transform:scaleY(.02)}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}@keyframes cursor{0%,60%{opacity:1}61%,100%{opacity:0}}
      @keyframes sweep{from{transform:rotate(-16deg)}to{transform:rotate(17deg)}}
      @keyframes scan{from{transform:translateY(0)}to{transform:translateY(182px)}}
      @keyframes route{0%{transform:translate(0,0)}25%{transform:translate(110px,0)}50%{transform:translate(110px,65px)}75%{transform:translate(225px,65px)}100%{transform:translate(0,0)}}
      @keyframes camera{0%,24.9%{opacity:1}25%,100%{opacity:0}}@keyframes flow{to{stroke-dashoffset:-42}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.camera{opacity:0}.camera-1{opacity:1}}
    </style>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#34473a" stroke-width=".7" opacity=".3"/></pattern>
<pattern id="check" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#c1f186"/><path d="M10 0h10v10H10zM0 10h10v10H0z" fill="#0b110e"/></pattern>
<linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#c1f186" stop-opacity=".22"/><stop offset="1" stop-color="#c1f186" stop-opacity="0"/></linearGradient>
<linearGradient id="shine"><stop stop-color="#c1f186" stop-opacity="0"/><stop offset=".5" stop-color="#c1f186" stop-opacity=".32"/><stop offset="1" stop-color="#c1f186" stop-opacity="0"/></linearGradient>
</defs>
<rect x=".75" y=".75" width="228.5" height="348.5" rx="8" fill="#0b110e" stroke="#34473a" stroke-width="1.5"/>
<text x="22" y="32" fill="#a1b19e" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.2" class="">CAM 02 / BACKEND</text><path d="M194 33L207 20M194 20H207V33" fill="none" stroke="#c1f186" stroke-width="2.5" stroke-linecap="square"/><text x="21" y="85" fill="#ecf3e7" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" text-anchor="start" letter-spacing="0" class="">Distributed</text><text x="21" y="122" fill="#ecf3e7" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" text-anchor="start" letter-spacing="0" class="">jobs</text><text x="22" y="158" fill="#a1b19e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0" class="">Distributed execution</text><text x="22" y="181" fill="#a1b19e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0" class="">in C#.</text><g transform="translate(23 214)"><path class="flow" d="M20 18H86V74H20Z" fill="none" stroke="#c1f186" stroke-width="2"/><rect x="4" y="7" width="28" height="22" rx="3" fill="#111b15" stroke="#c1f186" /><rect x="74" y="7" width="28" height="22" rx="3" fill="#111b15" stroke="#c1f186" /><rect x="4" y="65" width="28" height="22" rx="3" fill="#111b15" stroke="#c1f186" /><rect x="74" y="65" width="28" height="22" rx="3" fill="#111b15" stroke="#c1f186" /><rect x="40" y="35" width="28" height="22" rx="3" fill="#1d3023" stroke="#c1f186" /></g><text x="22" y="327" fill="#c1f186" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0" class="">C#</text><circle cx="204" cy="323" r="3" fill="#c1f186" class="pulse"/>
</svg>