<svg xmlns="http://www.w3.org/2000/svg" width="420" height="302" viewBox="0 0 420 302" role="img" aria-labelledby="title desc">
<title id="title">Maintenance console — development systems</title><desc id="desc">Backend, data and interface systems animate into place. Expand the corresponding maintenance sections for tools and project links.</desc>
<defs><style>
      .enter{animation:enter .7s ease-out backwards}.late{animation-delay:.18s}
      .fill{transform-box:fill-box;transform-origin:left center;animation:fill .9s cubic-bezier(.2,.8,.2,1) backwards}
      .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .85s cubic-bezier(.2,.8,.2,1) backwards}
      .pulse{animation:pulse 3s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(1) infinite}
      .sweep{transform-box:fill-box;transform-origin:100% 36%;animation:sweep 9s ease-in-out infinite alternate}
      .sweep-line{animation:scan 7s linear infinite}.route-dot{animation:route 8s linear infinite}
      .camera{animation:camera 16s steps(1) infinite}.camera-2{animation-delay:-12s}.camera-3{animation-delay:-8s}.camera-4{animation-delay:-4s}
      .flow{stroke-dasharray:7 14;animation:flow 3s linear infinite}.day{animation:enter .55s ease-out backwards}
      @keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
      @keyframes fill{from{transform:scaleX(.02)}}@keyframes rise{from{transform:scaleY(.02)}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}@keyframes cursor{0%,60%{opacity:1}61%,100%{opacity:0}}
      @keyframes sweep{from{transform:rotate(-16deg)}to{transform:rotate(17deg)}}
      @keyframes scan{from{transform:translateY(0)}to{transform:translateY(182px)}}
      @keyframes route{0%{transform:translate(0,0)}25%{transform:translate(110px,0)}50%{transform:translate(110px,65px)}75%{transform:translate(225px,65px)}100%{transform:translate(0,0)}}
      @keyframes camera{0%,24.9%{opacity:1}25%,100%{opacity:0}}@keyframes flow{to{stroke-dashoffset:-42}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.camera{opacity:0}.camera-1{opacity:1}}
    </style>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#bccab1" stroke-width=".7" opacity=".3"/></pattern>
<pattern id="check" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#345d2b"/><path d="M10 0h10v10H10zM0 10h10v10H0z" fill="#f3f5e9"/></pattern>
<linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#345d2b" stop-opacity=".22"/><stop offset="1" stop-color="#345d2b" stop-opacity="0"/></linearGradient>
<linearGradient id="shine"><stop stop-color="#345d2b" stop-opacity="0"/><stop offset=".5" stop-color="#345d2b" stop-opacity=".32"/><stop offset="1" stop-color="#345d2b" stop-opacity="0"/></linearGradient>
</defs>
<rect x=".75" y=".75" width="418.5" height="300.5" rx="8" fill="#f3f5e9" stroke="#bccab1" stroke-width="1.5"/>
<text x="28" y="35" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.2" class="">MAINTENANCE CONSOLE</text><text x="28" y="80" fill="#162d20" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" text-anchor="start" letter-spacing="0" class="">Keep every system running.</text><text x="28" y="108" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.2" class="">BACKEND</text><text x="208" y="108" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" class="">C# / Node.js</text><rect x="28" y="121" width="360" height="5" rx="2" fill="#d9e3cc" stroke="none" /><rect x="28" y="121" width="360" height="5" rx="2" fill="#345d2b" class="fill" style="animation-delay:0.0s"/><text x="28" y="168" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.2" class="">DATA</text><text x="208" y="168" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" class="">Python / SQL</text><rect x="28" y="181" width="360" height="5" rx="2" fill="#d9e3cc" stroke="none" /><rect x="28" y="181" width="360" height="5" rx="2" fill="#345d2b" class="fill" style="animation-delay:0.2s"/><text x="28" y="228" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.2" class="">INTERFACES</text><text x="208" y="228" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0" class="">React / Linux</text><rect x="28" y="241" width="360" height="5" rx="2" fill="#d9e3cc" stroke="none" /><rect x="28" y="241" width="360" height="5" rx="2" fill="#345d2b" class="fill" style="animation-delay:0.4s"/>
</svg>