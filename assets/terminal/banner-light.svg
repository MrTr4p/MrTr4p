<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="408" viewBox="0 0 1020 408" role="img" aria-labelledby="title desc">
<title id="title">MrTr4p — night shift developer terminal</title><desc id="desc">Omar Albosaty, software and data engineer. An animated CCTV map cycles through four project cameras. Use the links and expandable sections below.</desc>
<defs><style>
      .enter{animation:enter .7s ease-out backwards}.late{animation-delay:.18s}
      .fill{transform-box:fill-box;transform-origin:left center;animation:fill .9s cubic-bezier(.2,.8,.2,1) backwards}
      .rise{transform-box:fill-box;transform-origin:center bottom;animation:rise .85s cubic-bezier(.2,.8,.2,1) backwards}
      .pulse{animation:pulse 3s ease-in-out infinite}.cursor{animation:cursor 1.4s steps(1) infinite}
      .sweep{transform-box:fill-box;transform-origin:100% 36%;animation:sweep 9s ease-in-out infinite alternate}
      .sweep-line{animation:scan 7s linear infinite}.route-dot{animation:route 8s linear infinite}
      .camera{animation:camera 16s steps(1) infinite}.camera-2{animation-delay:-12s}.camera-3{animation-delay:-8s}.camera-4{animation-delay:-4s}
      .flow{stroke-dasharray:7 14;animation:flow 3s linear infinite}.day{animation:enter .55s ease-out backwards}
      @keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
      @keyframes fill{from{transform:scaleX(.02)}}@keyframes rise{from{transform:scaleY(.02)}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}@keyframes cursor{0%,60%{opacity:1}61%,100%{opacity:0}}
      @keyframes sweep{from{transform:rotate(-16deg)}to{transform:rotate(17deg)}}
      @keyframes scan{from{transform:translateY(0)}to{transform:translateY(182px)}}
      @keyframes route{0%{transform:translate(0,0)}25%{transform:translate(110px,0)}50%{transform:translate(110px,65px)}75%{transform:translate(225px,65px)}100%{transform:translate(0,0)}}
      @keyframes camera{0%,24.9%{opacity:1}25%,100%{opacity:0}}@keyframes flow{to{stroke-dashoffset:-42}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.camera{opacity:0}.camera-1{opacity:1}}
    </style>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#bccab1" stroke-width=".7" opacity=".3"/></pattern>
<pattern id="check" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#345d2b"/><path d="M10 0h10v10H10zM0 10h10v10H0z" fill="#f3f5e9"/></pattern>
<linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#345d2b" stop-opacity=".22"/><stop offset="1" stop-color="#345d2b" stop-opacity="0"/></linearGradient>
<linearGradient id="shine"><stop stop-color="#345d2b" stop-opacity="0"/><stop offset=".5" stop-color="#345d2b" stop-opacity=".32"/><stop offset="1" stop-color="#345d2b" stop-opacity="0"/></linearGradient>
</defs>
<rect x=".75" y=".75" width="1018.5" height="406.5" rx="8" fill="#f3f5e9" stroke="#bccab1" stroke-width="1.5"/>
<g class="enter"><text x="36" y="35" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.2" class="">NIGHT SHIFT / DEVELOPER TERMINAL</text><text x="31" y="141" fill="#162d20" font-family="Arial,Helvetica,sans-serif" font-size="98" font-weight="900" text-anchor="start" letter-spacing="-3" class="">MRTR4P</text><text x="37" y="181" fill="#345d2b" font-family="'Courier New',Courier,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="2" class="">OMAR ALBOSATY</text><text x="37" y="230" fill="#162d20" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" class="">Software &amp; data engineer.</text><text x="37" y="265" fill="#162d20" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" class="">Keeping the systems alive.</text></g><g transform="translate(584 55) scale(1.0153846153846153)"><rect x="0" y="0" width="390" height="282" rx="5" fill="#e8eddd" stroke="#bccab1" /><rect x="1" y="1" width="388" height="280" rx="5" fill="url(#grid)"/><text x="18" y="23" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.2" class="">CAMERA SYSTEM</text><text x="374" y="23" fill="#a63a2b" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="700" text-anchor="end" letter-spacing="0" class="">REC</text><circle cx="333" cy="19" r="3.5" fill="#a63a2b" class="pulse"/><path d="M136 71H166M80 104V135M222 104V135M136 167H166M278 167H332V235H151V200" fill="none" stroke="#506751" stroke-width="2"/><rect x="24" y="39" width="112" height="65" rx="2" fill="#f3f5e9" stroke="#bccab1" /><text x="34" y="63" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" class="">CAM 01</text><g class="camera camera-1"><rect x="24" y="39" width="112" height="65" rx="2" fill="#d9e3cc" stroke="#345d2b" /><text x="34" y="63" fill="#345d2b" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" class="">CAM 01</text><path d="M34 83h92" stroke="#345d2b" stroke-width="2"/></g><rect x="166" y="39" width="112" height="65" rx="2" fill="#f3f5e9" stroke="#bccab1" /><text x="176" y="63" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" class="">CAM 02</text><g class="camera camera-2"><rect x="166" y="39" width="112" height="65" rx="2" fill="#d9e3cc" stroke="#345d2b" /><text x="176" y="63" fill="#345d2b" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" class="">CAM 02</text><path d="M176 83h92" stroke="#345d2b" stroke-width="2"/></g><rect x="24" y="135" width="112" height="65" rx="2" fill="#f3f5e9" stroke="#bccab1" /><text x="34" y="159" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" class="">CAM 03</text><g class="camera camera-3"><rect x="24" y="135" width="112" height="65" rx="2" fill="#d9e3cc" stroke="#345d2b" /><text x="34" y="159" fill="#345d2b" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" class="">CAM 03</text><path d="M34 179h92" stroke="#345d2b" stroke-width="2"/></g><rect x="166" y="135" width="112" height="65" rx="2" fill="#f3f5e9" stroke="#bccab1" /><text x="176" y="159" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" class="">CAM 04</text><g class="camera camera-4"><rect x="166" y="135" width="112" height="65" rx="2" fill="#d9e3cc" stroke="#345d2b" /><text x="176" y="159" fill="#345d2b" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0" class="">CAM 04</text><path d="M176 179h92" stroke="#345d2b" stroke-width="2"/></g><path d="M316 67L284 43V91Z" fill="#345d2b" opacity=".85"/><polygon class="sweep" points="316,67 201,0 172,188" fill="url(#beam)"/><rect x="300" y="49" width="45" height="36" rx="3" fill="#f3f5e9" stroke="#345d2b" /><path d="M310 58h20v16h-20zM320 85V99M309 99h22" fill="none" stroke="#345d2b" stroke-width="2"/><circle cx="80" cy="71" r="3" fill="#8b5d14" class="route-dot"/><text x="20" y="256" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.2" class="">PROJECT SURVEILLANCE</text><text x="370" y="256" fill="#345d2b" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="700" text-anchor="end" letter-spacing="0" class="">4 FEEDS</text></g><rect x="37" y="303" width="216" height="29" rx="3" fill="#d9e3cc" stroke="#bccab1" /><text x="49" y="323" fill="#345d2b" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0" class="">C# / TYPESCRIPT / PYTHON</text><text x="37" y="370" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="1.2" class="">&gt;&gt;&gt; PORTFOLIO ACCESS GRANTED</text><text x="979" y="370" fill="#506751" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="600" text-anchor="end" letter-spacing="0" class="">SYSTEM RESTART</text><rect x="1" y="397" width="1018" height="10" fill="url(#check)" opacity=".55"/>
</svg>